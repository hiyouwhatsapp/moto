name: Focused DynamoDB verification
on:
  push:
    branches: [verify/query-partition-cloud]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'hiyouwhatsapp/moto'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8a4a7599a13d3b662e4233765de824b08c5b0b11
          persist-credentials: false
      - name: Verify exact source commit
        run: test "$(git rev-parse HEAD)" = "8a4a7599a13d3b662e4233765de824b08c5b0b11"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install repository development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip freeze
      - name: Repository lint and type checks
        run: make lint
      - name: DynamoDB and streams tests
        if: ${{ !cancelled() }}
        run: python -m pytest -q tests/test_dynamodb tests/test_dynamodbstreams --junitxml=dynamodb-results.xml
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dynamodb-python-${{ matrix.python-version }}
          path: dynamodb-results.xml
          if-no-files-found: ignore
